[project]
name = "xai-weather-workshop"
version = "0.1.0"
description = "XAI in Geoscience: From Feature Importance to Adjoint Sensitivities -- a hands-on XAI workshop"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<2.4",
    "scikit-learn>=1.5,<1.8",
    "matplotlib>=3.9,<3.11",
    "seaborn>=0.13,<0.14",
    "shap==0.48.0",
    "palmerpenguins>=0.1.4,<0.2",
    "cmocean>=4.0,<5.0",
    "jupyter>=1.0,<2.0",
    "ipykernel>=6.29,<7.0",
    "pillow>=10.0,<12.0",
    "plotly>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "nbmake>=1.5,<2.0",
    "pytest>=8.0,<9.0",
]

[tool.uv]
package = false
